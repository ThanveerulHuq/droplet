<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Droplet</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Droplet</h1>
      </header>
      <main>
        <label class="tracking-row">
          <span class="tracking-label">Tracking</span>
          <span class="tracking-switch">
            <input type="checkbox" id="trackingSwitch" role="switch" />
            <span class="tracking-track"></span>
          </span>
        </label>
        <!-- Scopes UI (Task 22/23): segmented control + figures/empty states, mounted by src/ui/app.ts. -->
        <section id="scopes" aria-label="Water use"></section>
        <!-- Methodology panel (Task 24): formula, coefficients + sources, limitations (PRD §5.2).
             Opened via the footer "How this works" link; closed via its own back control. -->
        <section id="methodology" aria-label="Methodology" hidden></section>
      </main>
      <footer>
        <span id="buildInfo"></span>
        <a id="methodologyLink" href="#">How this works</a>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
