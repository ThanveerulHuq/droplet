<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Droplet</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">
          <img class="brand-icon" src="/icons/droplet.webp" alt="" aria-hidden="true" />
          <h1>Droplet</h1>
        </div>
        <label class="tracking-row">
          <span class="tracking-label">Tracking</span>
          <span class="tracking-switch">
            <input type="checkbox" id="trackingSwitch" role="switch" />
            <span class="tracking-track"></span>
          </span>
        </label>
      </header>
      <main>
        <!-- Scopes UI (Task 22/23): segmented control + figures/empty states, mounted by src/ui/app.ts. -->
        <section id="scopes" aria-label="Water use"></section>
      </main>
      <footer>
        <a id="methodologyLink" href="https://droplet-rho.vercel.app/methodology.html" target="_blank" rel="noreferrer noopener">How this works</a>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
