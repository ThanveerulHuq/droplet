<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Droplet</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Droplet</h1>
        <nav class="view-tabs" aria-label="Popup views">
          <button type="button" class="view-tab" data-view="scopes" aria-selected="true">Water use</button>
          <button type="button" class="view-tab" data-view="methodology" aria-selected="false">Methodology</button>
          <button type="button" class="view-tab" data-view="settings" aria-selected="false">Settings</button>
        </nav>
      </header>
      <main>
        <!-- Scopes UI (Task 22/23): segmented control + figures/empty states, mounted by src/ui/app.ts. -->
        <section id="scopes" aria-label="Water use"></section>
        <!-- Methodology panel (Task 24): formula, coefficients + sources, limitations (PRD §5.2). -->
        <section id="methodology" aria-label="Methodology" hidden></section>
        <!-- Settings view (Task 25): controls persist to store.settings (PRD §5.3). -->
        <section id="settings" aria-label="Settings" hidden></section>
      </main>
      <footer id="buildInfo"></footer>
      <button id="seedDemoBtn" type="button" class="seed-demo">Seed demo data</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
