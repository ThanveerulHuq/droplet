<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Droplet mock — ChatGPT replica</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #212121;
    color: #ececec;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid #3a3a3a;
    font-size: 14px;
    color: #9b9b9b;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header code { color: #ececec; }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  #chatlog { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .message { max-width: 640px; padding: 12px 16px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; }
  .message[data-message-author-role="user"] { align-self: flex-end; background: #2f6feb; color: #fff; }
  .message[data-message-author-role="assistant"] { align-self: flex-start; background: #303030; border: 1px solid #3f3f3f; }
  .message .reasoning { color: #9b9b9b; font-size: 13px; border-left: 2px solid #4a4a4a; padding-left: 8px; margin: 4px 0 8px; }
  .composer {
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 16px 20px 24px;
    border-top: 1px solid #3a3a3a;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #prompt-textarea {
    flex: 1;
    resize: none;
    background: #303030;
    border: 1px solid #4a4a4a;
    border-radius: 12px;
    color: #ececec;
    padding: 10px 12px;
    font: inherit;
    min-height: 42px;
  }
  #prompt-textarea:focus { outline: none; border-color: #2f6feb; }
  .composer button {
    border: none;
    border-radius: 12px;
    padding: 10px 16px;
    font: inherit;
    cursor: pointer;
  }
  [data-testid="send-button"] { background: #2f6feb; color: #fff; }
  [data-testid="stop-button"] { background: #b42318; color: #fff; }
</style>
</head>
<body>
<header>
  <span>Droplet mock harness — replica of the classic ChatGPT DOM</span>
  <span>Driver: <code>__dropletMock.submitTurn(500, { reasoning: true })</code></span>
</header>
<main>
  <div id="chatlog">
    <div class="message" data-message-author-role="user">Welcome. Please summarize the repo.</div>
    <div class="message" data-message-author-role="assistant" data-message-id="static-welcome">
      <div class="reasoning" data-testid="reasoning">Reasoning block (matches the adapter's reasoning selector)</div>
      <p>Static replica assistant message. Scripted turns append new assistant messages below.</p>
    </div>
  </div>
</main>
<div class="composer">
  <textarea id="prompt-textarea" rows="1" placeholder="Message ChatGPT"></textarea>
  <button data-testid="send-button" type="button">Send</button>
</div>
</body>
</html>
